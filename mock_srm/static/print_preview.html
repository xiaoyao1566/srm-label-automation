<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>打印预览</title>
<style>
  body { margin:0; font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif; color:#1f2733; background:#fff; }
  .bar { background:#3c4657; color:#fff; padding:6px 12px; font-size:12px; }
  .body { padding:20px 22px; }
  .sheet { border:1px dashed #c9d1dc; border-radius:6px; padding:16px; color:#6b7684; }
  button { font:inherit; padding:8px 22px; border:0; border-radius:5px; background:#2b6cf6;
           color:#fff; cursor:pointer; margin-top:16px; }
  .ok { color:#1a7f4b; margin-top:12px; }
</style>
</head>
<body>
<div class="bar">打印预览 —— 这是**另一个窗口**，不在原页面里</div>
<div class="body">
  <div class="sheet" id="sheet">正在准备…</div>
  <button id="btn-real-print">打印</button>
  <div class="ok" id="ok"></div>
</div>
<script>
// ⚠️ 坑④：**这个按钮才是真正让纸出来的那一下。**
//    真机上它在浏览器的打印预览 UI 里，Playwright 的 DOM 点不到，
//    只能靠 Windows UI Automation 遍历控件树去点。
//    靶站用"另一个窗口"复刻"它不在当前页面里"这个本质：
//    脚本必须能接住新窗口（popup），而不是在原页面上找一个叫【打印】的按钮。
const 参数 = new URLSearchParams(location.search);
const 任务 = 参数.get("job"), 页数 = Number(参数.get("pages")||0), 条数 = Number(参数.get("count")||0);
document.getElementById("sheet").textContent =
  `任务号 ${任务} · 共 ${条数} 行 · 约 ${页数} 页`;

document.getElementById("btn-real-print").addEventListener("click", async ()=>{
  document.getElementById("btn-real-print").disabled = true;
  const r = await fetch("/api/print/commit", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({pages: 页数, printer: "MockPrinter", job: 任务})});
  const d = await r.json();
  document.getElementById("ok").textContent =
      d.ok ? `已提交到打印机（出纸记录 #${d.spoolId}）` : "提交失败";
});
</script>
</body>
</html>
