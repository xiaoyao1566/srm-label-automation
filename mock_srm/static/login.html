<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录 · 演示门户</title>
<style>
  body { margin:0; font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif; color:#1f2733;
         background:#f0f3f8; display:flex; align-items:center; justify-content:center; height:100vh; }
  .box { background:#fff; border-radius:10px; padding:28px 30px; width:340px;
         box-shadow:0 10px 30px rgba(20,30,50,.10); }
  h1 { font-size:17px; margin:0 0 18px; }
  label { display:block; margin-bottom:12px; color:#6b7684; font-size:13px; }
  input { width:100%; font:inherit; padding:8px 10px; border:1px solid #e3e6eb;
          border-radius:5px; margin-top:4px; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row label { flex:1; }
  .cap { display:flex; align-items:center; gap:6px; margin-top:4px; }
  .cap svg { border:1px solid #e3e6eb; border-radius:5px; background:#fafbfc; }
  button { font:inherit; width:100%; padding:9px; border:0; border-radius:5px;
           background:#2b6cf6; color:#fff; cursor:pointer; margin-top:8px; }
  .msg { color:#d93a3a; min-height:20px; font-size:13px; margin-top:6px; }
  .tip { color:#6b7684; font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<form class="box" id="loginForm">
  <h1>供应商门户（演示靶站）</h1>
  <label>账号<input id="account" autocomplete="off" placeholder="请输入账号"></label>
  <label>口令<input id="password" type="password" autocomplete="off" placeholder="请输入口令"></label>
  <label>验证码
    <div class="cap">
      <!-- ⚠️ 真实站点这一步要靠 OCR（验证码图片）。靶站把答案放在 DOM 里，
           目的是让"clone 下来就能跑"成立 —— 真机上必须接 OCR 或人工输入。 -->
      <svg id="capImg" class="validate-code" width="86" height="32" data-answer=""
           xmlns="http://www.w3.org/2000/svg"><text x="10" y="23" font-size="20"
           font-family="monospace" fill="#2b3a4d"></text></svg>
      <button type="button" id="refreshCap" style="width:auto;margin:0;padding:6px 10px;
              background:#fff;color:#2b6cf6;border:1px solid #e3e6eb;">换一张</button>
    </div>
  </label>
  <input id="captcha" autocomplete="off" placeholder="请输入验证码">
  <button type="submit">登录</button>
  <div class="msg" id="msg"></div>
  <div class="tip">这是作品集里的**靶站**：口令不校验内容，验证码答案内置。
    真实站点那一步是 OCR 识别 + 人工兜底。</div>
</form>

<script>
async function 换验证码(){
  const r = await fetch("/api/captcha");
  const d = await r.json();
  const svg = document.getElementById("capImg");
  svg.dataset.answer = d.captcha;
  svg.querySelector("text").textContent = d.captcha;
}
document.getElementById("refreshCap").addEventListener("click", 换验证码);

document.getElementById("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const 体 = {
    account: document.getElementById("account").value,
    password: document.getElementById("password").value,
    captcha: document.getElementById("captcha").value,
    // 真实站点没有这个字段；靶站用它替代 OCR，见上面注释
    captchaExpect: document.getElementById("capImg").dataset.answer
  };
  const r = await fetch("/api/login", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(体)});
  const d = await r.json();
  if (d.ok) { location.href = "/list"; }
  else { document.getElementById("msg").textContent = d.msg || "登录失败"; 换验证码(); }
});

换验证码();
</script>
</body>
</html>
